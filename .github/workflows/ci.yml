name: CI

# Sequential pytest on every push to main — matches local behaviour (no matrix, no xdist).
# The suite runs against the real CockroachDB Cloud cluster and real S3, so it needs the
# same secrets the app reads from .env locally (pydantic-settings reads env vars directly;
# no .env file is needed in CI).
on:
  push:
    branches: [main]
    # Frontend-only pushes touch neither the backend nor the cluster, so skip the
    # live pytest suite for them — the frontend has its own offline CI in
    # frontend-ci.yml. paths-ignore skips a push ONLY when every changed file is
    # under frontend/**; anything else (app code, migrations, seeds, tests, root
    # docs like CLAUDE.md/NOTES.md, or a workflow file) still runs the full suite.
    paths-ignore:
      - 'frontend/**'

# Cancel an in-flight run when a newer push lands on the same ref. Two concurrent runs would
# both TRUNCATE ... CASCADE the shared cluster and collide (see NOTES Phase 3, Step 7).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite runs SEQUENTIALLY against the real Frankfurt cluster + S3, and each test
    # reseeds (TRUNCATE CASCADE + reseed). Across Items 1-7 it grew from ~36 tests (~13 min) to
    # 89, ~36 of them cluster-bound AML load_graph round-trips plus atomic-invalidation (~132s),
    # consistency/SSE fan-out, replay and resilience suites. At 30 min it was CANCELLED mid-run
    # (not failed) at the timeout; CI-runner→Frankfurt latency makes real duration ~30-40 min.
    # 60 gives genuine headroom, not a squeak-by. If the suite ever nears this, consolidate the
    # 16 independent per-file reseeds (risky — see NOTES reseed-timing flakes) before raising more.
    timeout-minutes: 60
    env:
      # Real secrets (add these in GitHub → Settings → Secrets and variables → Actions):
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      # Required only so app.config imports; NO test makes a real OpenAI call (all 89 are
      # deterministic / OpenAI-free). A dummy value is deliberate — do NOT add the real key.
      OPENAI_API_KEY: sk-dummy-ci-openai-not-used
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
