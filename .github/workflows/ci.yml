name: CI

# Sequential pytest on every push to main — matches local behaviour (no matrix, no xdist).
# The suite runs against the real CockroachDB Cloud cluster and real S3, so it needs the
# same secrets the app reads from .env locally (pydantic-settings reads env vars directly;
# no .env file is needed in CI).
on:
  push:
    branches: [main]
    # Skip the live cluster suite for pushes that touch neither the backend nor the cluster:
    #   - frontend/**  — has its own offline CI in frontend-ci.yml.
    #   - *.md         — ROOT docs only (GitHub `*` does not cross `/`), so this matches
    #                    README/NOTES/ARCHITECTURE/DEMO/CLAUDE but NOT data/corpus/*.md (ingested
    #                    content, pinned by test_regulatory_corpus — that still runs the suite).
    #                    Root docs are guarded OFFLINE by docs-ci.yml instead (the @doc_guard set),
    #                    so a docs commit no longer reseeds and WIPES the cluster (7-8 min, measured;
    #                    NOTES "A FABRICATED DESCRIPTION OF A PRIMARY SOURCE").
    # paths-ignore skips a push ONLY when EVERY changed file matches. A mixed push (app code +
    # NOTES.md), migrations, seeds, tests, or a workflow file still runs the full suite.
    paths-ignore:
      - 'frontend/**'
      - '*.md'
      # Sanitized MCP config template (repo root, non-.md, no cluster surface). Committed so the
      # README's MCP references resolve in a public clone; a literal exact-path entry (no wildcard)
      # so an example-only edit routes offline instead of reseeding + WIPING the cluster. The commit
      # that ADDS this line still fires CI once, because it also edits this workflow file, which
      # matches none of these patterns (paths-ignore skips only when EVERY changed file matches).
      - '.mcp.json.example'
      # Environment template (repo root, non-.md, no cluster surface — placeholders only, never a
      # real secret). Committed because the OPENAI_API_KEY-must-be-PRESENT trap (app/config.py
      # declares it with no default, so even the read-only verify_* scripts die at import without
      # it) is undiagnosable from prose on a clean clone. Same literal exact-path entry as the line
      # above — no wildcard — so a template-only edit routes offline instead of reseeding + WIPING
      # the cluster. The commit that ADDS this line still fires CI once, for the same reason
      # .mcp.json.example's did: it also edits this workflow file, which matches none of these
      # patterns (paths-ignore skips only when EVERY changed file matches).
      - '.env.example'
      # The hold-out artifact trio. All three are OFFLINE by construction and have NO cluster
      # surface: a JSON of raw integer counts, a stdlib-only recomputation of them, and the
      # @doc_guard test that runs the recomputation (pinned cluster-free by
      # tests/test_doc_guard_marker.py, which runs the marked set against a dead host). docs-ci.yml
      # lists these same three paths, so an edit to any of them still gets GUARDED — it routes to
      # the offline job instead of reseeding and WIPING the cluster.
      #
      # THREE LITERAL EXACT PATHS, no wildcard — the same shape as the two entries above, and for
      # the same reason. `tests/**` would be catastrophic here (it would skip the cluster suite on
      # any test change); `eval/**` would wrongly skip it on the grounding-eval fixtures. Each entry
      # was verified to match exactly one file and to contain no glob character.
      #
      # The commit that ADDS these lines still fires CI once, because it also edits this workflow
      # file, which matches none of these patterns (paths-ignore skips only when EVERY changed file
      # matches).
      - 'eval/detection/holdout_result.json'
      - 'scripts/verify_holdout.py'
      - 'tests/test_holdout_artifact.py'

# Cancel an in-flight run when a newer push lands on the same ref. Two concurrent runs would
# both reseed the shared cluster and race (now a row-level write-write conflict rather than the
# old TRUNCATE "indexes being dropped" schema-change collision, NOTES Phase 3 Step 7 — but a
# race either way), so keep exactly one live.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite runs SEQUENTIALLY against the real Frankfurt cluster + S3. Each reseeding
    # test resets via ordered DELETEs (seed.seed(), ~1s), NOT TRUNCATE — that swap cut the suite
    # from ~36 min to 2m39s locally (measured 2026-07-10, 89 passed — historical, deliberately NOT
    # carried forward: the suite is 237 now, but 237 tests were never timed at 2m39s and a number
    # you have not measured does not get restated at a new-looking value. Do NOT "fix" the 89; to
    # update this pair, re-time the suite — which costs a full run and a cluster wipe). The slowest
    # tests are now the inherently-timed ones (demo/SSE fan-out ~10s, real S3 round-trip ~9s, eventual
    # per-holder delay ~7s), not reseeds, so there is no bulk reseed cost left to cut. CI adds
    # runner->Frankfurt latency + the pip-install step on top of the pytest wall time; 15 min is
    # honest headroom (~2-3x the expected job time), not the old 40-min-over-runtime cushion.
    timeout-minutes: 15
    env:
      # Real secrets (add these in GitHub → Settings → Secrets and variables → Actions):
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      # Required only so app.config imports; NO test makes a real OpenAI call (all 237 are
      # deterministic / OpenAI-free). A dummy value is deliberate — do NOT add the real key.
      OPENAI_API_KEY: sk-dummy-ci-openai-not-used
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
