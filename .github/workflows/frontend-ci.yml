name: frontend-ci

# Build / typecheck / lint the Vite frontend on pushes to main that touch it.
#
# Deliberately SEPARATE from ci.yml (the backend pytest suite). This job is fully
# OFFLINE — no DATABASE_URL, no AWS creds, no CockroachDB connection, no secrets —
# so it can never collide with the backend CI's live-cluster reseeds (the
# TRUNCATE ... CASCADE "indexes being dropped" gotcha; see NOTES Phase 3, Step 7).
#
# Scope is Tier 1 only: build/typecheck/lint, mirroring the manual checks every
# frontend phase ends with per FRONTEND.md/NOTES discipline. Tier 2 (Vitest unit
# tests on the pure logic) is a deliberately deferred next step — not wired here.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel an in-flight run when a newer push lands on the same ref (cheap; nothing
# live is touched, kept only for parity with the backend workflow).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      # THE COMPOSITION GUARD — no component may hold both the evidence layer and the audit layer.
      #
      # IT RUNS HERE AND NOT IN PYTEST, and that is load-bearing rather than a convenience. The
      # backend workflow (ci.yml) has no Node step, and — far worse — it declares
      # `paths-ignore: ['frontend/**']`, so a frontend-only push does not run the backend suite AT
      # ALL. A pytest composition guard would have been skipped by exactly the pushes that can
      # violate it: a check that cannot fail on the change it protects against — the same disease
      # as the vacuous typecheck (tests/test_frontend_typecheck.py), one layer up. This project has
      # paid for that once already.
      #
      # tests/test_composition_guard.py asserts that THIS STEP EXISTS. Workflow files are not in
      # ci.yml's paths-ignore, so deleting it fails the backend suite.
      - name: Composition guard (the oracle boundary, in the component tree)
        run: npm run guard:composition

      # THE FABRICATED-DATA GUARD — the DC design-port's demo literals may never enter frontend/src.
      #
      # The design port (DESIGN_PORT_DIAGNOSIS.md) copies the DC bundle's VISUAL design, but that
      # bundle hardcodes a demo dataset that is wrong in ways that look right (an invented azure
      # belief id, a fabricated confidence-curve middle, invented dates/IBANs/HLC/amounts, a made-up
      # supervisor name). This is a string denylist scan — offline, sub-second, no cluster — and it
      # runs HERE for the same reason the composition guard does: ci.yml declares
      # `paths-ignore: ['frontend/**']`, so a frontend-only push (exactly the push that could paste a
      # DC literal) never runs the backend suite. The guard re-proves itself on a committed fixture
      # every run (scripts/fixtures/fabricated-data.fixture.txt): a gutted guard, or one that
      # over-reaches onto legit math, fails its own self-test.
      - name: Fabricated-data guard (DC demo literals must not reach frontend/src)
        run: npm run guard:data

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (vite build)
        run: npx vite build

      # THE GEOMETRY GUARD — the invariant that is only provable by RENDERING.
      #
      # `.kill__actions` stacks (flex-direction: column) so that CANCEL takes the arm button's
      # footprint and CONFIRM sits clear of it. That is a SAFETY MECHANISM, not a style choice: with
      # the governed write pinned in a footer, the arm and confirm buttons share one bottom-anchored
      # region, and two clicks of muscle memory in one screen position would be an irreversible
      # fleet-wide write. A confirm gate protects against not KNOWING; it cannot protect against not
      # MOVING YOUR HAND. Until this step existed, a flip back to `row` was caught by NOTHING.
      #
      # It cannot be a pytest grep for `flex-direction: column`: that asserts the CSS TEXT, not the
      # geometry, and would pass a `.kill__cancel { position: absolute }` without blinking. It runs
      # against a real browser over the REAL BUILD, with the console's data replayed from responses
      # captured off the live cluster (frontend/tests-e2e/mock.ts).
      #
      # STILL FULLY OFFLINE. No DATABASE_URL, no cluster — frontend pushes remain the only pushes
      # that do not reseed it. tests/test_console_fixtures.py (backend suite, which DOES see every
      # backend change) pins those fixtures to the live API so the mock cannot drift, and
      # tests/test_console_fixtures.py::test_frontend_ci_actually_invokes_the_geometry_guard asserts
      # THIS STEP EXISTS — workflow files are not in ci.yml's paths-ignore, so deleting it fails the
      # backend suite.
      # The browser is ~130MB and is the bulk of this guard's cost.
      #
      # THE KEY TRACKS THE RESOLVED VERSION, NOT A FLOATING TAG — checked, not assumed. package.json
      # declares `^1.61.1`, but `npm ci` installs from the LOCKFILE, which pins 1.61.1 exactly. So
      # hashing package-lock.json means the cache key changes whenever the Playwright version does,
      # and a stale browser can never be restored for a new version. It over-invalidates (any
      # unrelated dependency bump re-downloads) — that direction is safe; the other is not.
      #
      # WHAT IS *NOT* CACHED, STATED PLAINLY: `--with-deps` installs system libraries via apt, and
      # those live outside ~/.cache/ms-playwright. The runner image is fresh every push, so that part
      # runs EVERY time regardless of a cache hit. Dropping `--with-deps` would buy that back and
      # risk a cryptic browser-launch failure instead — a guard that cannot RUN is a guard that
      # cannot FAIL, and this project does not trade correctness for seconds.
      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium for the geometry guard
        run: npx playwright install --with-deps chromium

      - name: Geometry guard (Confirm must not land on the arm button's footprint)
        run: npm run guard:geometry
