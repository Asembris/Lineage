name: frontend-ci

# Build / typecheck / lint the Vite frontend on pushes to main that touch it.
#
# Deliberately SEPARATE from ci.yml (the backend pytest suite). This job is fully
# OFFLINE — no DATABASE_URL, no AWS creds, no CockroachDB connection, no secrets —
# so it can never collide with the backend CI's live-cluster reseeds (the
# TRUNCATE ... CASCADE "indexes being dropped" gotcha; see NOTES Phase 3, Step 7).
#
# Scope is Tier 1 only: build/typecheck/lint, mirroring the manual checks every
# frontend phase ends with per FRONTEND.md/NOTES discipline. Tier 2 (Vitest unit
# tests on the pure logic) is a deliberately deferred next step — not wired here.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel an in-flight run when a newer push lands on the same ref (cheap; nothing
# live is touched, kept only for parity with the backend workflow).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      # THE COMPOSITION GUARD — no component may hold both the evidence layer and the audit layer.
      #
      # IT RUNS HERE AND NOT IN PYTEST, and that is load-bearing rather than a convenience. The
      # backend workflow (ci.yml) has no Node step, and — far worse — it declares
      # `paths-ignore: ['frontend/**']`, so a frontend-only push does not run the backend suite AT
      # ALL. A pytest composition guard would have been skipped by exactly the pushes that can
      # violate it: a check that cannot fail on the change it protects against. That is the
      # `tsc --noEmit` disease one layer up, and this project has paid for it once already.
      #
      # tests/test_composition_guard.py asserts that THIS STEP EXISTS. Workflow files are not in
      # ci.yml's paths-ignore, so deleting it fails the backend suite.
      - name: Composition guard (the oracle boundary, in the component tree)
        run: npm run guard:composition

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (vite build)
        run: npx vite build
